      description: |-
        POS sales: create at checkout, browse history, delete to void.

        - search:  ?search=  over customer name/phone, note, and the sale's item
                     names + barcodes (so a scanned barcode finds sales containing
                     that product)
        - filter:  ?customer=<id> ?payment_method=cash|debt ?item=<name|barcode>
        - sort:    ?ordering=-created_at | discounted_total ...
        Deleting a sale restores stock and removes its linked (unpaid) debt.
      parameters:
      - in: query
        name: created_after
        schema:
          type: string
          format: date
      - in: query
        name: created_before
        schema:
          type: string
          format: date
      - in: query
        name: created_by
        schema:
          type: integer
      - in: query
        name: customer
        schema:
          type: number
      - in: query
        name: is_return
        schema:
          type: boolean
      - in: query
        name: item
        schema:
          type: string
      - in: query
        name: max_price
        schema:
          type: number
      - in: query
        name: min_price
        schema:
          type: number
      - name: ordering
        required: false
        in: query
        description: Which field to use when ordering the results.
        schema:
          type: string
      - name: page
        required: false
        in: query
        description: A page number within the paginated result set.
        schema:
          type: integer
      - name: page_size
        required: false
        in: query
        description: Number of results to return per page.
        schema:
