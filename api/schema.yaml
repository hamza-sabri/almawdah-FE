        - sort:    ?ordering=-created_at | total | discounted_total ...
      parameters:
      - in: query
        name: customer
        schema:
          type: number
      - in: query
        name: is_paid
        schema:
          type: boolean
      - name: ordering
        required: false
        in: query
        description: Which field to use when ordering the results.
        schema:
          type: string
      - name: page
        required: false
        in: query
        description: A page number within the paginated result set.
        schema:
          type: integer
      - name: page_size
        required: false
        in: query
        description: Number of results to return per page.
        schema:
