openapi: 3.0.3
info:
  title: Backend API
  version: 1.0.0
  description: API built from the django-backend-template.
paths:
  /api/v1/audit/:
    get:
      operationId: audit_retrieve
      description: |-
        GET  /api/v1/audit/            — recent destructive actions (owner-only)
        POST /api/v1/audit/<id>/undo/    — put a bulk edit back.

        Undo restores the exact previous value of every field the action changed,
        row by row, inside one transaction. It is refused once already undone, or
        when the action was too large to snapshot — we never pretend.
      tags:
      - audit
      security:
      - jwtAuth: []
      - cookieAuth: []
      responses:
        '200':
          description: No response body
    post:
      operationId: audit_create
      description: |-
        GET  /api/v1/audit/            — recent destructive actions (owner-only)
        POST /api/v1/audit/<id>/undo/    — put a bulk edit back.

        Undo restores the exact previous value of every field the action changed,
        row by row, inside one transaction. It is refused once already undone, or
        when the action was too large to snapshot — we never pretend.
      tags:
      - audit
      security:
      - jwtAuth: []
      - cookieAuth: []
      responses:
        '200':
          description: No response body
  /api/v1/audit/{id}/undo/:
    get:
      operationId: audit_undo_retrieve
      description: |-
        GET  /api/v1/audit/            — recent destructive actions (owner-only)
        POST /api/v1/audit/<id>/undo/    — put a bulk edit back.

        Undo restores the exact previous value of every field the action changed,
        row by row, inside one transaction. It is refused once already undone, or
        when the action was too large to snapshot — we never pretend.
      parameters:
      - in: path
        name: id
        schema:
          type: integer
        required: true
      tags:
      - audit
      security:
      - jwtAuth: []
      - cookieAuth: []
      responses:
        '200':
          description: No response body
    post:
      operationId: audit_undo_create
      description: |-
        GET  /api/v1/audit/            — recent destructive actions (owner-only)
        POST /api/v1/audit/<id>/undo/    — put a bulk edit back.

        Undo restores the exact previous value of every field the action changed,
        row by row, inside one transaction. It is refused once already undone, or
        when the action was too large to snapshot — we never pretend.
      parameters:
      - in: path
        name: id
        schema:
          type: integer
        required: true
      tags:
      - audit
      security:
      - jwtAuth: []
      - cookieAuth: []
      responses:
        '200':
          description: No response body
  /api/v1/auth/login/:
    post:
      operationId: auth_login_create
      description: POST username + password -> {access, refresh, user}.
      tags:
      - auth
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CustomTokenObtainPairRequest'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/CustomTokenObtainPairRequest'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/CustomTokenObtainPairRequest'
        required: true
      responses:
        '200':
          description: No response body
  /api/v1/auth/logout/:
    post:
      operationId: auth_logout_create
      description: Blacklist a refresh token so it can no longer be used.
      tags:
      - auth
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/LogoutRequest'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/LogoutRequest'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/LogoutRequest'
        required: true
      security:
      - jwtAuth: []
      - cookieAuth: []
      responses:
        '205':
          description: No response body
  /api/v1/auth/me/:
    get:
      operationId: auth_me_retrieve
      description: GET/PATCH the currently authenticated user.
      tags:
      - auth
      security:
      - jwtAuth: []
      - cookieAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/User'
          description: ''
    put:
      operationId: auth_me_update
      description: GET/PATCH the currently authenticated user.
      tags:
      - auth
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UserRequest'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/UserRequest'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/UserRequest'
        required: true
      security:
      - jwtAuth: []
      - cookieAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/User'
          description: ''
    patch:
      operationId: auth_me_partial_update
      description: GET/PATCH the currently authenticated user.
      tags:
      - auth
      requestBody:
        content:
