        password:
          type: string
          writeOnly: true
          minLength: 4
    PatchedUserRequest:
      type: object
      properties:
        username:
          type: string
          minLength: 1
          description: فريد داخل الصيدلية الواحدة (وليس عبر النظام).
          pattern: ^[\w.@+-]+$
          maxLength: 150
        email:
