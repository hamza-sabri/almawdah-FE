  /api/v1/customers/:
    get:
      operationId: customers_list
      description: |-
        CRUD + search/filter/sort for customer profiles.

        - search:  ?search=  over name, phone, status, notes
        - filter:  ?status= ?phone= ?gender=  ?has_debt=true|false
        - sort:    ?ordering=name | -created_at | -outstanding | outstanding ...
        Each row is annotated with `outstanding` = sum of unpaid debts.
      parameters:
      - name: ordering
        required: false
        in: query
        description: Which field to use when ordering the results.
        schema:
          type: string
      - name: page
        required: false
        in: query
        description: A page number within the paginated result set.
        schema:
          type: integer
      - name: page_size
        required: false
        in: query
        description: Number of results to return per page.
        schema:
          type: integer
      - name: search
        required: false
        in: query
        description: A search term.
        schema:
          type: string
      tags:
      - customers
      security:
      - jwtAuth: []
      - cookieAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PaginatedCustomerList'
          description: ''
    post:
      operationId: customers_create
      description: |-
        CRUD + search/filter/sort for customer profiles.

        - search:  ?search=  over name, phone, status, notes
        - filter:  ?status= ?phone= ?gender=  ?has_debt=true|false
