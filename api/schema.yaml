    PatchedProductRequest:
      type: object
      description: |-
        Full CRUD for a med.

        Images: `image`/`image_file` is the MAIN photo (URL or upload, as before).
        `images` reads the ordered secondary gallery as [{id, url}]; upload more
        via `image_files` (repeat the key for several files) and delete existing
        ones via `remove_images` ("3,7" — ids). Max 8 secondary photos.
        `category` / `manufacturer` read and write as plain name strings.
      properties:
        source_id:
          type: string
          maxLength: 64
        name:
          type: string
          maxLength: 255
        barcode:
          type: string
          maxLength: 120
        original_number:
          type: string
          maxLength: 120
        price:
          type: string
          format: decimal
          pattern: ^-?\d{0,10}(?:\.\d{0,2})?$
          title: Retail price
        cost:
          type: string
          format: decimal
          pattern: ^-?\d{0,10}(?:\.\d{0,2})?$
        brand:
          type: string
          maxLength: 255
        manufacturer:
          type: string
          nullable: true
        category:
          type: string
          nullable: true
        stock:
          type: string
          format: decimal
          pattern: ^-?\d{0,9}(?:\.\d{0,3})?$
        expiry_date:
          type: string
          format: date
          nullable: true
        expiry_alert_days:
          type: integer
          maximum: 9223372036854775807
          minimum: 0
          format: int64
          nullable: true
        notes:
          type: string
        image:
          type: string
          format: uri
          maxLength: 1000
        video_url:
          type: string
          format: uri
          maxLength: 1000
        attributes: {}
        image_file:
          type: string
          format: binary
          writeOnly: true
        image_files:
          type: array
          items:
            type: string
            format: binary
          writeOnly: true
        image_urls:
          type: array
          items:
            type: string
            format: uri
            minLength: 1
            maxLength: 1000
          writeOnly: true
        remove_images:
          type: string
          writeOnly: true
        client_uuid:
          type: string
          nullable: true
          maxLength: 64
    PatchedProductVariantRequest:
      type: object
      description: A sellable sub-SKU (color / size / flavor) with its own price and
