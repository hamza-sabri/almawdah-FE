components:
  schemas:
    Category:
      type: object
      description: Name + how many meds use it (fed to the searchable dropdowns).
      properties:
        id:
          type: integer
          readOnly: true
        name:
          type: string
          maxLength: 120
        count:
          type: integer
          readOnly: true
          default: 0
      required:
      - count
      - id
      - name
    CategoryRequest:
      type: object
      description: Name + how many meds use it (fed to the searchable dropdowns).
      properties:
        name:
          type: string
          minLength: 1
          maxLength: 120
      required:
      - name
    CustomTokenObtainPairRequest:
      type: object
      description: |-
        Login response includes the serialized user alongside the tokens.

        Accepts an optional `store` (slug) field: usernames are unique per
        store, so tenant sites send their own slug to pin the lookup. The
        slug reaches PharmacyScopedBackend via authenticate(store_slug=...);
        kwargs-unaware backends are skipped by Django automatically.
      properties:
        store:
          type: string
          writeOnly: true
        username:
          type: string
          writeOnly: true
          minLength: 1
        password:
          type: string
          writeOnly: true
          minLength: 1
      required:
      - password
      - username
    Customer:
      type: object
      description: |-
        Customer profile (managed by staff; customers never log in).

        Set `avatar` to a URL directly, OR upload via `avatar_file`. `outstanding`
        is the sum of `discounted_total` across the customer's unpaid debts.
      properties:
        id:
          type: integer
          readOnly: true
        name:
          type: string
          maxLength: 255
        phone:
          type: string
          nullable: true
          maxLength: 40
        gender:
          $ref: '#/components/schemas/GenderEnum'
        avatar:
          type: string
          format: uri
          maxLength: 1000
        notes:
          type: string
        status:
          type: string
          maxLength: 255
        outstanding:
          type: string
          readOnly: true
        client_uuid:
          type: string
          nullable: true
          maxLength: 64
        created_at:
          type: string
          format: date-time
          readOnly: true
        updated_at:
          type: string
          format: date-time
          readOnly: true
      required:
      - created_at
      - id
      - name
      - outstanding
      - updated_at
    CustomerRequest:
      type: object
      description: |-
        Customer profile (managed by staff; customers never log in).

        Set `avatar` to a URL directly, OR upload via `avatar_file`. `outstanding`
        is the sum of `discounted_total` across the customer's unpaid debts.
      properties:
        name:
          type: string
          minLength: 1
          maxLength: 255
        phone:
          type: string
          nullable: true
          maxLength: 40
        gender:
          $ref: '#/components/schemas/GenderEnum'
        avatar:
          type: string
          format: uri
          maxLength: 1000
        avatar_file:
          type: string
          format: binary
          writeOnly: true
        notes:
          type: string
        status:
          type: string
          maxLength: 255
        client_uuid:
          type: string
          nullable: true
          maxLength: 64
      required:
      - name
    Debt:
      type: object
      description: |-
        A debt with its meds.

        - `total` is computed from the items at purchase time and is READ-ONLY.
        - `discounted_total` defaults to `total`; send it to override (a discount).
        - Each item snapshots the med's name and price, so later catalogue changes
          never rewrite an existing debt.
      properties:
        id:
          type: integer
          readOnly: true
        customer:
          type: integer
        customer_name:
          type: string
          readOnly: true
        customer_phone:
          type: string
          readOnly: true
        items:
          type: array
          items:
            $ref: '#/components/schemas/DebtItem'
        total:
          type: string
          format: decimal
          pattern: ^-?\d{0,10}(?:\.\d{0,2})?$
          readOnly: true
        discounted_total:
          type: string
          format: decimal
          pattern: ^-?\d{0,10}(?:\.\d{0,2})?$
        is_paid:
          type: boolean
        note:
          type: string
        client_uuid:
          type: string
          nullable: true
          maxLength: 64
        created_by:
          type: integer
          readOnly: true
          nullable: true
        created_by_name:
          type: string
          readOnly: true
        created_at:
          type: string
          format: date-time
          readOnly: true
        updated_at:
          type: string
          format: date-time
          readOnly: true
      required:
      - created_at
      - created_by
      - created_by_name
      - customer
      - customer_name
      - customer_phone
      - id
      - total
      - updated_at
    DebtItem:
      type: object
      description: A single med line inside a debt. `line_total` is computed server-side.
      properties:
        id:
          type: integer
          readOnly: true
        product:
          type: integer
          nullable: true
        variant:
          type: integer
          nullable: true
        medication_name:
          type: string
          maxLength: 255
        variant_label:
          type: string
          readOnly: true
        unit_price:
          type: string
          format: decimal
          pattern: ^-?\d{0,10}(?:\.\d{0,2})?$
        quantity:
          type: string
          format: decimal
          pattern: ^-?\d{0,9}(?:\.\d{0,3})?$
        line_total:
          type: string
